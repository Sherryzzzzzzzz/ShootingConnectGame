// ============================================================
// ShootingConnectGame — 网络协议定义
// 参考 SpaceBuilder 的 proto 结构设计：
//   - NetModel.proto (核心网络消息)
//   - AbilityNetModel.proto (技能同步)
//   - ItemNetModel.proto (物品同步)
//
// 使用方式：
//   1. 修改此文件
//   2. Unity Editor → Tools → ShootingGame → Update Protobuf
//   3. 生成的 C# 代码写入 ../Generated/ 目录
// ============================================================

syntax = "proto3";
package ShootingGame.Protocol;

// ==================== 数学类型（跨平台共享） ====================

message PVec2 {
  float x = 1;
  float y = 2;
}

message PVec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PQuat {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// ==================== GameplayTag 位掩码 ====================

message PGameplayTagMask {
  int64 self_mask = 1;
  int64 descendant_mask = 2;
}

// ==================== 大厅/用户消息 ====================

message PUserInfo {
  int32 user_id = 1;
  string username = 2;
  string password = 3;
}

message PRoomInfo {
  int32 room_id = 1;
  string room_name = 2;
  string creator_name = 3;
  int32 player_count = 4;
  int32 max_players = 5;
  int32 status = 6; // 0=Waiting, 1=Playing
}

message PBattlePlayerPack {
  int32 user_id = 1;
  int32 battle_id = 2;   // battlePlayerId in battle context
  string player_name = 3;
  int32 team_id = 4;
  int32 hero_id = 5;
}

message PSpawnPoint {
  PVec3 position = 1;
  float yaw = 2;
  int32 team_id = 3;
}

// ==================== 战斗消息 ====================

message PPlayerOperation {
  int32 player_id = 1;
  float move_x = 2;
  float move_y = 3;
  float aim_yaw = 4;
  float aim_pitch = 5;
  bool fire = 6;
  bool jump = 7;
  bool run = 8;
  bool aim = 9;
  bool reload = 10;
  bool ability1 = 11;
  bool ability2 = 12;
  bool ability3 = 13;
  bool ability4 = 14;
  int32 attack_id = 15;
  int32 client_frame_id = 16;
  // 客户端预测位置/速度（服务端验证用）
  float pos_x = 17;
  float pos_y = 18;
  float pos_z = 19;
  float vel_x = 20;
  float vel_z = 21;
  bool is_grounded = 22;
  repeated PAttackOperation attack_operations = 23;
  repeated PAbilityEventData ability_events = 24;
}

message PAttackOperation {
  int32 attack_id = 1;
  float toward_x = 2;
  float toward_y = 3;
  float aim_pitch = 4;
  int32 client_frame_id = 5;
  PVec3 spawn_pos = 6;
}

message PAbilityEventData {
  int32 player_id = 1;
  int32 instance_id = 2;
  int32 ability_asset_id = 3;
  AbilityEventType event_type = 4;
}

enum AbilityEventType {
  ABILITY_EVENT_NONE = 0;
  ABILITY_EVENT_ACTIVATE = 1;
  ABILITY_EVENT_DEACTIVATE = 2;
  ABILITY_EVENT_CONFIRM_ACTIVATE = 3;
  ABILITY_EVENT_REJECT_ACTIVATE = 4;
}

message PPlayerStateMsg {
  int32 player_id = 1;
  PVec3 position = 2;
  PQuat rotation = 3;
  PVec3 velocity = 4;
  float vertical_velocity = 5;
  bool is_grounded = 6;
  int32 state_enum = 7;
  int32 hp = 8;
  int32 max_hp = 9;
  int32 current_ammo = 10;
  bool is_reloading = 11;
  float reload_timer = 12;
  int32 last_consumed_frame = 13;
  bool is_dead = 14;
}

message PHitEventMsg {
  int32 target_id = 1;
  int32 shooter_id = 2;
  int32 damage = 3;
  PVec3 hit_point = 4;
  int32 attack_id = 5;
  int32 hit_part = 6;
}

message PAllPlayerOperation {
  int32 frame_id = 1;
  repeated PPlayerOperation operations = 2;
  repeated PPlayerStateMsg player_states = 3;
  repeated PHitEventMsg hit_events = 4;
  repeated PAbilityEventData ability_events = 5;
}

message PBattleInfo {
  int32 operation_id = 1;
  int32 battle_id = 2;
  int32 rand_seed = 3;
  int32 client_acked_frame = 4;
  PPlayerOperation self_operation = 5;
  repeated PPlayerOperation operations = 6;
  repeated PPlayerStateMsg player_states = 7;
  repeated PHitEventMsg hit_events = 8;
  repeated PBattlePlayerPack battle_players = 9;
  repeated PSpawnPoint spawn_points = 10;
  bytes collision_data = 11;
}

// ==================== 玩家快照（ECS 同步） ====================

message PPlayerSnapshot {
  int32 tick = 1;
  PVec3 position = 2;
  PQuat rotation = 3;
  PVec3 velocity = 4;
  float vertical_velocity = 5;
  bool is_grounded = 6;
  int32 state = 7;
  float fire_cooldown = 8;
  int32 health = 9;
  int32 current_ammo = 10;
  bool is_reloading = 11;
  float reload_timer = 12;
  int64 tag_bitmask = 13;
  repeated PAbilityInstanceData active_abilities = 14;
}

message PAbilityInstanceData {
  int32 instance_id = 1;
  int32 ability_asset_id = 2;
  float cooldown_normalized = 3;
  int32 state = 4;
}

message PInputFrame {
  int32 tick = 1;
  PVec2 movement = 2;
  bool jump = 3;
  bool run = 4;
  bool aim = 5;
  bool fire = 6;
  bool reload = 7;
  bool ability1 = 8;
  bool ability2 = 9;
  bool ability3 = 10;
  bool ability4 = 11;
  float aim_yaw = 12;
  float aim_pitch = 13;
}

// ==================== RPC 消息 ====================

message PRpcMessage {
  uint32 net_id = 1;
  int64 method_id = 2;
  uint32 req_id = 3;  // 0 = Fire-and-Forget, >0 = 需要回复的事务ID
  repeated PNetValue args = 4;
}

message PRpcResponseMsg {
  uint32 req_id = 1;
  PNetValue return_value = 2;
}

// ==================== 万能参数值（参考 SpaceBuilder NetValue） ====================

message PNetValue {
  oneof kind {
    bool bool_val = 1;
    uint32 uint_val = 2;
    int32 int_val = 3;
    int64 long_val = 4;
    float float_val = 5;
    double double_val = 6;
    string string_val = 7;
    bytes bytes_val = 8;
    PVec3 vec3_val = 10;
    PQuat quat_val = 11;
    PVec2 vec2_val = 12;
  }
}

// ==================== 消息类型枚举（与 SpaceBuilder MsgType 对齐） ====================

enum PMsgType {
  MSG_NONE = 0;
  MSG_HEARTBEAT = 1;
  MSG_INPUT = 2;
  MSG_WORLD_STATE = 3;
  MSG_DAMAGE_EVENT = 4;
  MSG_RPC = 11;
  MSG_RPC_RESPONSE = 12;
  MSG_WORLD_SNAPSHOT = 14;
  MSG_CONNECTION_REQUEST = 17;
  MSG_CONNECTION_ACCEPTED = 18;
  MSG_PLAYER_JOINED = 19;
  MSG_PLAYER_LEFT = 20;
  MSG_CLIENT_DISCONNECT = 21;
}

// ==================== 顶层信封（类比 SpaceBuilder NetPacket） ====================

message PNetPacket {
  PMsgType type = 1;
  bytes data = 2; // 具体的业务 Protobuf 序列化数据
}

// ==================== 大厅信封（保留现有 MainPack 路由设计） ====================

enum PRequestCode {
  REQ_NONE = 0;
  REQ_USER = 1;
  REQ_MATCHING = 2;
  REQ_BATTLE = 3;
}

enum PActionCode {
  ACT_NONE = 0;
  // User
  ACT_LOGIN = 1;
  ACT_LOGIN_RESULT = 2;
  // Matching (100-199)
  ACT_JOIN_QUEUE = 100;
  ACT_LEAVE_QUEUE = 101;
  ACT_MATCH_FOUND = 102;
  ACT_START_ENTER_BATTLE = 103;
  ACT_ONLINE_PLAYERS = 104;
  // Room (150-169)
  ACT_ROOM_LIST = 150;
  ACT_CREATE_ROOM = 151;
  ACT_JOIN_ROOM = 152;
  ACT_LEAVE_ROOM = 153;
  ACT_ROOM_UPDATE = 154;
  // Battle (200-299)
  ACT_BATTLE_READY = 200;
  ACT_BATTLE_START = 201;
  ACT_BATTLE_OPERATION = 202;
  ACT_BATTLE_FRAME = 203;
  ACT_HIT_EVENT = 204;
  ACT_GAME_OVER = 205;
  ACT_PING = 206;
  ACT_PONG = 207;
  ACT_PLAYER_JOINED = 208;
  ACT_PLAYER_LEFT = 209;
  ACT_DISCONNECT = 210;
  // Hero Select (220-229)
  ACT_HERO_SELECTED = 220;
  ACT_HERO_CONFIRMED = 221;
  // RPC & Delta (230-239)
  ACT_RPC_CALL = 230;
  ACT_DELTA_STATE = 231;
}

enum PReturnCode {
  RET_SUCCESS = 0;
  RET_FAIL = 1;
  RET_NOT_FOUND = 2;
  RET_ALREADY_EXISTS = 3;
  RET_SERVER_FULL = 4;
}

message PMainPack {
  PRequestCode request_code = 1;
  PActionCode action_code = 2;
  PReturnCode return_code = 3;
  int64 timestamp = 4;
  string str_val = 5;
  int32 int_val = 6;
  PBattleInfo battle_info = 8;
  PUserInfo user_info = 9;
  PRoomInfo room_info = 10;
  repeated PRoomInfo room_infos = 11;
  repeated PBattlePlayerPack battle_player_packs = 12;
  bytes rpc_payload = 13;
}

// ==================== 心跳 ====================

message PHeartbeatMsg {
  double client_timestamp = 1;
  double server_timestamp = 2;
}

// ==================== 连接管理 ====================

message PConnectionRequestMsg {
  int32 protocol_version = 1;
  string token = 2;
}

message PConnectionAcceptedMsg {
  int32 player_id = 1;
  int32 tick_rate = 2;
  int32 server_tick = 3;
  string token = 4;
}

message PPlayerJoinedMsg {
  int32 player_id = 1;
}

message PPlayerLeftMsg {
  int32 player_id = 1;
}

// ==================== 世界快照（断线重连用） ====================

message PWorldSnapshotMsg {
  int32 server_tick = 1;
  uint32 state_revision = 2;
  repeated PPlayerSnapshot entities = 3;
}
